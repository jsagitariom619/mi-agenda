<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<title>Mi Agenda</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--ink:#172b2a;--muted:#6d7d7b;--primary:#0f766e;--line:#e3e9e8;--danger:#dc2626;--shadow:0 10px 30px rgba(15,118,110,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:22px 18px 12px;background:linear-gradient(145deg,#0f766e,#134e4a);color:#fff;border-radius:0 0 28px 28px}
.toprow{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.sub{font-size:13px;opacity:.75;margin-top:3px}.iconbtn{width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:19px}
.balance{margin-top:24px}.balance small{opacity:.75}.balance strong{display:block;font-size:34px;letter-spacing:-1px;margin-top:4px}.month{font-size:13px;opacity:.8}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{background:rgba(255,255,255,.12);padding:13px;border-radius:16px}.stat b{display:block;font-size:18px;margin-top:4px}
main{padding:18px}.section{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.section h2{font-size:17px;margin:0}.link{font-size:13px;color:var(--primary);font-weight:700;background:none;border:0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);color:var(--ink)}.action span{display:grid;place-items:center;width:38px;height:38px;margin:auto;border-radius:13px;background:#e7f5f3;font-size:20px}.action label{display:block;font-size:11px;margin-top:8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.item{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#eef6f5;font-size:19px}.name{font-weight:750;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:800}.income{color:#15803d}.expense{color:#b91c1c}.pending{color:#b45309}.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(490px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 35px rgba(0,0,0,.12);border-radius:22px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:transparent;padding:8px 4px;border-radius:16px;color:var(--muted);font-size:10px;font-weight:700}.nav button.active{background:#e8f5f3;color:var(--primary)}.nav i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}
.screen{display:none}.screen.active{display:block}.modal{position:fixed;inset:0;background:rgba(9,31,30,.48);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:min(520px,100%);border-radius:28px 28px 0 0;padding:20px 18px 28px;max-height:90vh;overflow:auto}.handle{width:42px;height:4px;border-radius:9px;background:#d4dddc;margin:0 auto 18px}.sheet h2{margin:0 0 16px;font-size:20px}.form{display:grid;gap:11px}.form label{font-size:12px;font-weight:700;color:var(--muted)}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit;background:#fbfcfc}.primary{border:0;background:var(--primary);color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:14px}.secondary{border:1px solid var(--line);background:#fff;padding:13px;border-radius:14px;font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:55px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px}.dot{width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:7px}.calendarhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendarhead button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px}.badge{padding:5px 8px;border-radius:9px;background:#fff4df;color:#a16207;font-size:10px;font-weight:800}
@media(min-width:700px){body{background:#e9eeee}.app{background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.08)}}
</style></head>
<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">Mi Agenda</div><div class="sub">Finanzas + agenda personal</div></div><button class="iconbtn" onclick="openModal('note')">＋</button></div><div class="balance"><small>Balance disponible</small><strong id="balance">Bs 0</strong><div class="month" id="monthLabel"></div></div><div class="stats"><div class="stat"><small>Ingresos</small><b id="income">Bs 0</b></div><div class="stat"><small>Egresos</small><b id="expense">Bs 0</b></div></div></header>
<main>
<section id="home" class="screen active"><div class="section"><h2>Acciones rápidas</h2></div><div class="actions"><button class="action" onclick="openModal('income')"><span>↗</span><label>Ingreso</label></button><button class="action" onclick="openModal('expense')"><span>↘</span><label>Egreso</label></button><button class="action" onclick="openModal('payment')"><span>◷</span><label>Pago</label></button><button class="action" onclick="openModal('task')"><span>✓</span><label>Pendiente</label></button></div><div class="section" style="margin-top:24px"><h2>Próximos pagos</h2><button class="link" onclick="show('payments')">Ver todos</button></div><div id="homePayments"></div><div class="section" style="margin-top:24px"><h2>Movimientos recientes</h2><button class="link" onclick="show('finance')">Ver todos</button></div><div id="recent"></div></section>
<section id="finance" class="screen"><div class="section"><h2>Finanzas</h2><button class="link" onclick="openModal('income')">＋ Registrar</button></div><div class="card"><div class="row"><div><div class="meta">Balance del mes</div><div style="font-size:27px;font-weight:850;margin-top:3px" id="financeBalance">Bs 0</div></div><div class="badge" id="financeCount">0 movimientos</div></div></div><div id="allMovements"></div></section>
<section id="payments" class="screen"><div class="section"><h2>Pagos pendientes</h2><button class="link" onclick="openModal('payment')">＋ Nuevo</button></div><div id="paymentsList"></div></section>
<section id="agenda" class="screen"><div class="section"><h2>Agenda</h2><button class="link" onclick="openModal('task')">＋ Pendiente</button></div><div class="card"><div class="calendarhead"><button onclick="changeMonth(-1)">‹</button><b id="calTitle"></b><button onclick="changeMonth(1)">›</button></div><div class="calendar" id="calendar"></div></div><div class="section"><h2>Pendientes</h2></div><div id="tasks"></div></section>
</main><nav class="nav"><button class="active" onclick="show('home',this)"><i>⌂</i>Inicio</button><button onclick="show('finance',this)"><i>◒</i>Finanzas</button><button onclick="show('payments',this)"><i>◷</i>Pagos</button><button onclick="show('agenda',this)"><i>☷</i>Agenda</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><div class="handle"></div><div id="modalContent"></div></div></div>
<script>
const KEY='mi-agenda-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"movements":[],"payments":[],"tasks":[]}');let cal=new Date();const money=n=>'Bs '+Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:0,maximumFractionDigits:2});const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-BO',{day:'2-digit',month:'short'});
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function totals(){let i=data.movements.filter(x=>x.type==='income').reduce((a,x)=>a+ +x.amount,0),e=data.movements.filter(x=>x.type==='expense').reduce((a,x)=>a+ +x.amount,0);return{i,e,b:i-e}}
function render(){let t=totals(),now=new Date();document.getElementById('balance').textContent=money(t.b);document.getElementById('income').textContent=money(t.i);document.getElementById('expense').textContent=money(t.e);document.getElementById('monthLabel').textContent=now.toLocaleDateString('es-BO',{month:'long',year:'numeric'});document.getElementById('financeBalance').textContent=money(t.b);document.getElementById('financeCount').textContent=data.movements.length+' movimientos';renderPayments();renderMovements();renderCalendar();renderTasks()}
function itemMove(x){return `<div class="card"><div class="row"><div class="item"><div class="avatar">${x.type==='income'?'↗':'↘'}</div><div><div class="name">${esc(x.title)}</div><div class="meta">${esc(x.category||'General')} · ${fmt(x.date)}</div></div></div><div class="amount ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div></div>`}function renderMovements(){let s=[...data.movements].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('recent').innerHTML=s.slice(0,4).map(itemMove).join('')||'<div class="card empty">Todavía no hay movimientos.</div>';document.getElementById('allMovements').innerHTML=s.map(itemMove).join('')||'<div class="card empty">Registra tu primer ingreso o egreso.</div>'}
function paymentItem(p){let overdue=p.status==='pending'&&new Date(p.date+'T23:59:00')<new Date();return `<div class="card"><div class="row"><div class="item"><div class="avatar">◷</div><div><div class="name">${esc(p.title)}</div><div class="meta">${fmt(p.date)} · ${esc(p.category||'General')}</div></div></div><div style="text-align:right"><div class="amount pending">${money(p.amount)}</div><button class="link" onclick="pay('${p.id}')">${p.status==='paid'?'Pagado':'Marcar pagado'}</button></div></div>${overdue?'<div style="color:#b91c1c;font-size:11px;font-weight:800;margin-top:9px">VENCIDO</div>':''}</div>`}function renderPayments(){let p=[...data.payments].sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('paymentsList').innerHTML=p.map(paymentItem).join('')||'<div class="card empty">No tienes pagos pendientes.</div>';document.getElementById('homePayments').innerHTML=p.filter(x=>x.status!=='paid').slice(0,3).map(paymentItem).join('')||'<div class="card empty">Todo al día 🎉</div>'}
function pay(id){let p=data.payments.find(x=>x.id===id);if(!p||p.status==='paid')return;p.status='paid';data.movements.push({id:crypto.randomUUID(),type:'expense',title:p.title,amount:p.amount,category:p.category,date:new Date().toISOString().slice(0,10)});save()}function renderTasks(){let t=data.tasks.filter(x=>!x.done);document.getElementById('tasks').innerHTML=t.map(x=>`<div class="card"><div class="row"><div class="item"><button class="secondary" style="padding:7px 10px" onclick="doneTask('${x.id}')">✓</button><div><div class="name">${esc(x.title)}</div><div class="meta">${x.date?fmt(x.date):'Sin fecha'}</div></div></div></div></div>`).join('')||'<div class="card empty">No tienes pendientes. Todo limpio.</div>'}function doneTask(id){let x=data.tasks.find(x=>x.id===id);if(x)x.done=true;save()}
function renderCalendar(){let y=cal.getFullYear(),m=cal.getMonth();document.getElementById('calTitle').textContent=new Date(y,m,1).toLocaleDateString('es-BO',{month:'long',year:'numeric'});let first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),out=['L','M','X','J','V','S','D'].map(x=>`<div style="font-size:10px;color:var(--muted);text-align:center">${x}</div>`).join('');for(let i=0;i<first;i++)out+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=data.payments.some(x=>x.date===ds&&x.status!=='paid')||data.tasks.some(x=>x.date===ds);out+=`<div class="day"><b>${d}</b>${has?'<div class="dot"></div>':''}</div>`}document.getElementById('calendar').innerHTML=out}function changeMonth(n){cal.setMonth(cal.getMonth()+n);renderCalendar()}
function show(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');else document.querySelectorAll('.nav button')[['home','finance','payments','agenda'].indexOf(id)].classList.add('active')}
function openModal(type){let titles={income:'Nuevo ingreso',expense:'Nuevo egreso',payment:'Nuevo pago pendiente',task:'Nuevo pendiente',note:'Nueva nota'},isMov=type==='income'||type==='expense';document.getElementById('modalContent').innerHTML=`<h2>${titles[type]}</h2><form class="form" onsubmit="submitForm(event,'${type}')"><label>Concepto<input id="fTitle" required placeholder="Ej. Consulta, Internet, préstamo..."></label>${isMov||type==='payment'?'<label>Monto<input id="fAmount" type="number" min="0" step="0.01" required placeholder="0"></label>':''}<label>Fecha<input id="fDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label>${isMov||type==='payment'?'<label>Categoría<select id="fCat"><option>General</option><option>Trabajo</option><option>Hogar</option><option>Servicios</option><option>Transporte</option><option>Alimentación</option><option>Compras</option><option>Otros</option></select></label>':''}<button class="primary" type="submit">Guardar</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></form>`;document.getElementById('modal').classList.add('show')}
function submitForm(e,type){e.preventDefault();let title=document.getElementById('fTitle').value.trim(),date=document.getElementById('fDate').value||new Date().toISOString().slice(0,10);if(type==='income'||type==='expense')data.movements.push({id:crypto.randomUUID(),type,title,amount:+document.getElementById('fAmount').value,category:document.getElementById('fCat').value,date});else if(type==='payment')data.payments.push({id:crypto.randomUUID(),title,amount:+document.getElementById('fAmount').value,category:document.getElementById('fCat').value,date,status:'pending'});else data.tasks.push({id:crypto.randomUUID(),title,date,done:false});closeModal();save()}function closeModal(){document.getElementById('modal').classList.remove('show')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
</script></body></html>
